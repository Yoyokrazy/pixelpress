name: Bug report
description: Something is broken or behaves unexpectedly
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more detail you give, the
        more likely the automated triage can act on it directly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: When I convert a rotated photo, the PDF page comes out sideways.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Images to PDF
        - PDF to Images
        - Toolbox (merge / split / organise)
        - Something else
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130 on macOS 15
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files involved
      description: >
        Roughly what were you converting? Number of files, formats, sizes,
        anything unusual (very large images, encrypted PDFs, photos from a
        phone). Please do not upload anything confidential.

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Any errors from the browser developer console.
      render: text
