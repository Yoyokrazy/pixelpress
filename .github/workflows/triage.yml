name: Issue triage

# Labels every newly filed issue and, when the issue looks actionable, asks
# GitHub Copilot to attempt a fix. Classification lives in
# .github/scripts/triage.mjs so it can be unit tested (src/test/triage.test.ts).
#
# Assigning the Copilot coding agent requires a *user* token: the default
# GITHUB_TOKEN is a GitHub App installation token and the API rejects it with
# "Assigning agents is not supported with GitHub App installation tokens".
# Add a fine-grained PAT with `issues: write` as the COPILOT_ASSIGN_TOKEN
# secret to enable the hand-off. Without it triage still labels and comments,
# and eligible issues are left for a human.
on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to (re-)triage
        required: true
        type: number

permissions:
  issues: write
  contents: read

concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Triage issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Classify and label
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const { triageIssue } =
              await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.mjs`);

            const number = Number(
              context.payload.issue?.number ?? context.payload.inputs?.issue_number,
            );
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: number,
            });

            if (issue.pull_request) {
              core.info('Target is a pull request, not an issue. Skipping.');
              core.setOutput('skip', 'true');
              return;
            }

            const result = triageIssue({
              title: issue.title ?? '',
              body: issue.body ?? '',
              author: issue.user?.login ?? '',
              labels: (issue.labels ?? []).map((l) => (typeof l === 'string' ? l : l.name)),
            });

            core.notice(
              `Issue #${number} categorised as "${result.category}" (auto-fix eligible: ${result.autoFixEligible}).`,
            );

            // Drop the holding label now that a decision has been made.
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: number,
              labels: result.labels.filter((label) => label !== 'needs-triage'),
            });
            await github.rest.issues
              .removeLabel({ ...context.repo, issue_number: number, name: 'needs-triage' })
              .catch(() => core.debug('needs-triage was not present.'));

            core.setOutput('skip', 'false');
            core.setOutput('eligible', String(result.autoFixEligible));
            core.setOutput('issue_number', String(number));
            core.setOutput('result', JSON.stringify(result));

      - name: Ask Copilot to attempt a fix
        id: assign
        if: steps.classify.outputs.skip == 'false' && steps.classify.outputs.eligible == 'true'
        # Never fail the run just because the agent could not be assigned; the
        # comment step reports whatever happened.
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          HAS_USER_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN != '' }}
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const number = Number('${{ steps.classify.outputs.issue_number }}');

            if (process.env.HAS_USER_TOKEN !== 'true') {
              core.warning(
                'COPILOT_ASSIGN_TOKEN is not configured, so the Copilot coding agent cannot be assigned. Add a fine-grained PAT with issues:write to enable automated fix attempts.',
              );
              core.setOutput('outcome', 'unavailable');
              return;
            }

            // Copilot is exposed as a suggested actor rather than a normal
            // assignable user, so the hand-off goes through GraphQL.
            const { repository } = await github.graphql(`
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 25) {
                    nodes { login ... on Bot { id } ... on User { id } }
                  }
                  issue(number: $number) { id }
                }
              }`,
              { owner: context.repo.owner, name: context.repo.repo, number },
            );

            const copilot = repository.suggestedActors.nodes.find(
              (node) => node.login === 'copilot-swe-agent',
            );

            if (!copilot) {
              core.warning('The Copilot coding agent is not available on this repository.');
              core.setOutput('outcome', 'unavailable');
              return;
            }

            try {
              await github.graphql(`
                mutation($assignableId: ID!, $actorIds: [ID!]!) {
                  replaceActorsForAssignable(
                    input: { assignableId: $assignableId, actorIds: $actorIds }
                  ) {
                    assignable { ... on Issue { number } }
                  }
                }`,
                { assignableId: repository.issue.id, actorIds: [copilot.id] },
              );
            } catch (error) {
              core.warning(`Could not assign Copilot: ${error.message}`);
              core.setOutput('outcome', 'unavailable');
              return;
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: number,
              labels: ['auto-fix-attempted'],
            });
            core.notice(`Assigned issue #${number} to Copilot.`);
            core.setOutput('outcome', 'assigned');

      - name: Comment with the triage outcome
        if: steps.classify.outputs.skip == 'false'
        uses: actions/github-script@v9
        env:
          TRIAGE_RESULT: ${{ steps.classify.outputs.result }}
          ELIGIBLE: ${{ steps.classify.outputs.eligible }}
          ASSIGN_OUTCOME: ${{ steps.assign.outputs.outcome }}
        with:
          script: |
            const { formatTriageComment } =
              await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.mjs`);

            const number = Number('${{ steps.classify.outputs.issue_number }}');
            const result = JSON.parse(process.env.TRIAGE_RESULT);
            const assignment =
              process.env.ELIGIBLE === 'true'
                ? process.env.ASSIGN_OUTCOME || 'unavailable'
                : 'skipped';

            // An eligible issue that could not be handed off still needs a human.
            if (assignment === 'unavailable') {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: number,
                labels: ['needs-human'],
              });
            }

            // Only comment once, so edits do not spam the thread.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: number,
              per_page: 100,
            });
            if (comments.some((comment) => comment.body?.includes('### Automated triage'))) {
              core.info('Triage comment already present; not posting another.');
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: number,
              body: formatTriageComment(result, assignment),
            });
