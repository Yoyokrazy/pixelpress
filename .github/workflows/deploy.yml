name: Deploy to GitHub Pages

# Runs automatically on push, but only once Pages is actually available for
# this repository. GitHub Pages requires either a public repository or a paid
# plan, so the `check` job probes the Pages API first and the rest of the
# workflow skips cleanly when it is not yet enabled. Nothing needs changing
# here after enabling Pages — the next push simply deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check Pages availability
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages is enabled - continuing with the deployment."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository, so the deployment was skipped. Enable it under Settings > Pages with GitHub Actions as the source; the next push will then deploy automatically."
          fi

  build:
    name: Build site
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Pages serves the site from /<repo>/, so the bundle needs a matching base.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
