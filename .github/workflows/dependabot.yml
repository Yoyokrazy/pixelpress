name: Dependabot

# Reviews Dependabot pull requests automatically. Patch and minor updates are
# merged once CI is green; major updates are labelled and left for a human,
# since those are the ones that break things.
#
# Security note: this uses `pull_request_target`, which runs with repository
# write access. It deliberately never checks out or executes the pull request's
# code — it only reads Dependabot's metadata and calls the API — so untrusted
# code from a branch cannot run here. Permissions are granted per job rather
# than at the top level.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review Dependabot PR
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is required by `gh pr merge --auto`.
      contents: write
      pull-requests: write
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label the update type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-major) LABEL="major-update" ;;
            version-update:semver-minor) LABEL="minor-update" ;;
            version-update:semver-patch) LABEL="patch-update" ;;
            *)                           LABEL="" ;;
          esac
          if [ -n "$LABEL" ]; then
            gh pr edit "$PR_URL" --add-label "$LABEL" || true
          fi

      - name: Enable auto-merge for patch and minor updates
        # Major bumps are deliberately excluded: they are the ones most likely
        # to need code changes, so a human should look at them.
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash --auto
          gh pr comment "$PR_URL" --body \
            "Auto-merge enabled: this is a \`${{ steps.metadata.outputs.update-type }}\` update and will merge once CI passes."

      - name: Flag major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" --add-label "needs-human" || true
          gh pr comment "$PR_URL" --body \
            "This is a **major** version bump of \`${{ steps.metadata.outputs.dependency-names }}\`, so auto-merge was not enabled. Please check the changelog for breaking changes before merging."
